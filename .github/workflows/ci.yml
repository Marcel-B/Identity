name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [Sqlite, Postgres]
    name: test (${{ matrix.database }})
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Throw-away database for the tests, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      IDENTITY_TEST_DATABASE: ${{ matrix.database }}
      IDENTITY_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build Identity.slnx
      - name: Migrations match the model
        run: >-
          dotnet ef migrations has-pending-model-changes -p src/Identity.Server --no-build
          --context ${{ matrix.database }}ApplicationDbContext
        env:
          Database__Provider: ${{ matrix.database }}
          ConnectionStrings__Identity: ${{ matrix.database == 'Sqlite' && 'Data Source=unused.db' || 'Host=localhost;Database=unused;Username=postgres' }}
      - run: dotnet test --no-build
